name: Build dotfiles archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-archive:
    name: Create .tar.gz archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:7}"
          archive_name="dotfiles-${short_sha}.tar.gz"

          git archive \
            --format=tar.gz \
            --prefix="dotfiles-${short_sha}/" \
            --output="${archive_name}" \
            "${GITHUB_SHA}"

          echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_ENV}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE_NAME }}
          archive: false
          if-no-files-found: error
